name: Diagnostico videos R2
on: { push: { branches: [diag-videos] } }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Medir videos
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          BASE="https://pub-1d728663a780452887b21c5b936d69d3.r2.dev/"
          enc(){ python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$1"; }
          probe(){ n="$1"; u="$BASE$(enc "$n").mp4"
            out=$(curl -sS -A "$UA" -H "Origin: https://localhost" -o /tmp/v.mp4 -D /tmp/h.txt -w '%{http_code}|%{size_download}|%{time_starttransfer}|%{time_total}|%{speed_download}' "$u")
            IFS='|' read code size ttfb tot spd <<<"$out"
            fs=$(python3 -c "d=open('/tmp/v.mp4','rb').read();m=d.find(b'moov');a=d.find(b'mdat');print('SI' if 0<=m<a else ('NO' if m>=0 else 'sin moov'))")
            hd=$(grep -iE '^(cache-control|cf-cache-status|access-control-allow-origin|accept-ranges|content-type|server):' /tmp/h.txt | tr -d '\r' | tr '\n' ' ')
            echo "::notice title=$n::HTTP $code | $(python3 -c "print(round($size/1e6,2))") MB | ttfb ${ttfb}s | total ${tot}s | $(python3 -c "print(round($spd/1e6,2))") MB/s | faststart $fs | $hd"; }
          for n in "Back Lever" "Jalón Trasnuca con Banda" "Extensión de Tríceps con Cuerda" "Curl de Bíceps Alterno" "Ángel de Pared" "Sentadilla Ciclista"; do probe "$n"; done
          probe "Back Lever"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" "$BASE$(enc 'Back Lever').json"); echo "::notice title=Ficha JSON::HTTP $code"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$(enc 'Back Lever').mp4"); echo "::notice title=Sin user-agent de navegador::HTTP $code"
