name: Bajar fichas de R2
# Solo en la rama fichas-revision: baja las descripciones para revisarlas. No compila ni publica nada.
on:
  push:
    branches: [fichas-revision]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node .github/scripts/bajar_fichas.js
      - name: Guardar las fichas en esta rama
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add fichas && git commit -q -m "Fichas bajadas de R2 [skip ci]" && git push -q origin HEAD:fichas-revision
